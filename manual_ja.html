<!doctype html>
<html lang="ja">

<head>
	<link rel="stylesheet" href="main.css">
	<link rel="shortcut icon" href="#">
	<title>WebToysPlayerCheers</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<div>
		<h3>使い方</h3>
	</div>

<div class="ui">
①<button id="mediaButton" type="button" style="color: red;">動画や音声を選択</button></br>
赤いボタンを押して、動画・音声ファイルを選択します。</br>
※登録済みのスクリプトを自動でロードします。</br>

</div>
<div class="ui">
②<button id="folderInputButton" type="button" style="color: blue;">フォルダからスクリプトを一括登録</button></br>
青いボタンを押して、フォルダを選択し、Funscript/CSVを一括登録します。</br>
※zipファイルやサブフォルダの中にあるスクリプトも登録されます。</br>
</div>

<div class="ui">
③<button id="zipUploadBtn">ZIPファイルをインポート</button></br>
<button id="zipDownloadBtn">ZIP形式でエクスポート</button></br>
登録したスクリプトを一括で入出力可能です。</br>
ドラッグするとフォルダ階層の中に移動できます。</br>
</div>

<div class="ui">
④動作がおかしい時は、リロードしてください。
※登録したスクリプトはブラウザに保存されます。
※外部へデータを送信することはありません。
</div>

</body>

</html>
