<!doctype html>
<html lang="ja">

<head>
	<link rel="stylesheet" href="main.css">
	<link rel="shortcut icon" href="#">
	<title>WebToysPlayerCheers</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
	<div>
		<h3>使い方</h3>
	</div>

<div class="ui">
①↓動画・音声ファイルを選択します。</br>
　登録済みのスクリプトを自動でロードします。</br>
<button id="mediaButton" type="button" style="color: red;">動画や音声を選択</button>
</div>
<div class="ui">
②↓フォルダを指定して、Funscript/CSVを一括登録します。</br>
　サブフォルダやzipファイルの中にあるスクリプトも登録されます。</br>
<button id="folderInputButton" type="button" style="color: blue;">フォルダからスクリプトを一括登録</button>
</div>

<div class="ui">
③↓登録したスクリプトを一括で入出力可能です。</br>
<button id="zipUploadBtn">ZIPファイルをインポート</button>
<button id="zipDownloadBtn">ZIP形式でエクスポート</button>

</div>

</body>

</html>
